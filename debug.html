<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>IFS Debug</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #errors {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 99999;
        max-width: 100%;
        max-height: 60vh;
        overflow: auto;
        background: rgba(10, 10, 20, 0.92);
        color: #ff7777;
        font: 12px/1.4 Consolas, monospace;
        white-space: pre-wrap;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="errors">collecting…</div>
    <script>
      window.__errors = [];
      window.addEventListener(
        "error",
        (e) => {
          window.__errors.push(
            (e.message || "?") + "  @  " + (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?")
          );
          try {
            document.getElementById("errors").textContent = window.__errors.join("\n\n");
          } catch (_) {}
        },
        true
      );
      window.addEventListener(
        "unhandledrejection",
        (e) => {
          const r = e.reason;
          const msg = (r && (r.stack || r.message)) || String(r);
          window.__errors.push("UNHANDLED REJECTION:\n" + msg);
          try {
            document.getElementById("errors").textContent = window.__errors.join("\n\n");
          } catch (_) {}
        },
        true
      );
    </script>
    <script type="module">
      import "/src/main.tsx";
    </script>
  </body>
</html>
